name: Setup CI
description: Checkout-time setup shared by every CI job (pnpm, node, install)

runs:
  using: composite
  steps:
    - name: setup pnpm
      uses: pnpm/action-setup@v4

    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: install dependencies
      shell: bash
      env:
        HUSKY: 0
      run: pnpm install --frozen-lockfile
